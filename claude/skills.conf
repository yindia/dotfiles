# Claude Code skill profiles.
#
# Skills live in claude/skills/, one directory per skill, exactly like
# nvim/plugins and zsh/plugins. Add them however you like:
#
#     # something you wrote yourself
#     mkdir -p claude/skills/my-skill && $EDITOR claude/skills/my-skill/SKILL.md
#     git add claude/skills/my-skill
#
#     # something maintained elsewhere
#     git submodule add https://github.com/user/some-skill.git claude/skills/some-skill
#
# Committing is not optional: deploy.zsh runs `git clean -ffd`, so an untracked
# skill directory would be deleted on the next checkout or merge. deploy.zsh
# stops with an error if it finds one instead of letting that happen.
#
# Each profile below lists which skills get linked into ~/.claude/skills. Pick
# one per machine with $CLAUDE_PROFILE, which defaults to "default":
#
#     CLAUDE_PROFILE=work ./deploy.zsh
#
# A line starting with @ pulls in another profile, so profiles compose instead
# of repeating themselves. Set CLAUDE_PROFILE=none to skip skill linking.
#
# Skills already present in ~/.claude/skills are left alone. Deploy only ever
# creates, updates, or removes symlinks that point back into this repo, so
# whatever else you have installed there is never touched.

# Linked on every machine unless CLAUDE_PROFILE says otherwise.
[default]

# A deliberately small set, for servers and throwaway boxes.
[minimal]

# Everything in default, plus whatever is only useful at work.
[work]
@default

# Everything in default, plus personal-machine extras.
[personal]
@default
